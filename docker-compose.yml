# ADRESTIA — optional Docker run (native setup remains primary).
# Ollama stays on the HOST (this compose never pulls model weights).
# 1. On the host: install Ollama, `ollama pull <your-model>`, `ollama serve`
# 2. Set backend MODE=LOCAL_MODEL and OLLAMA_MODEL to that tag
# 3. docker compose up --build
# Frontend :3000, Backend :8000/docs
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODE: LOCAL_MODEL
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:7b}
    volumes:
      - ./backend/data:/srv/data
      - ./backend/logs:/srv/logs

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
